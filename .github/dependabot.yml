# Dependency policy
#   * one grouped PR per class, weekly (Monday)
#   * minor + patch only: major bumps are never opened unattended, because
#     TypeScript 6/7, vite 8 and friends break these builds on arrival.
#     Do majors deliberately: `npx npm-check-updates -u` on a branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
